<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Dallas app iPhone preview</title>
  <desc id="desc">An iPhone render showing the Dallas recovery planning app home screen.</desc>
  <defs>
    <linearGradient id="phoneEdge" x1="105" x2="790" y1="42" y2="1068" gradientUnits="userSpaceOnUse">
      <stop stop-color="#223632"/>
      <stop offset=".48" stop-color="#0f1917"/>
      <stop offset="1" stop-color="#2f4741"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="190" x2="710" y1="146" y2="958" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf8"/>
      <stop offset=".58" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#e8f0ec"/>
    </linearGradient>
    <linearGradient id="cover" x1="201" x2="699" y1="210" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7e9dd"/>
      <stop offset=".48" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#bedbd4"/>
    </linearGradient>
    <linearGradient id="accent" x1="274" x2="626" y1="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33d75a"/>
      <stop offset=".5" stop-color="#5ce36f"/>
      <stop offset="1" stop-color="#2f7168"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="900" height="1120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="46" stdDeviation="46" flood-color="#17211f" flood-opacity=".22"/>
    </filter>
    <filter id="softShadow" x="120" y="120" width="660" height="900" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17211f" flood-opacity=".12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-4 450 560)">
    <rect x="116" y="38" width="668" height="1044" rx="92" fill="url(#phoneEdge)"/>
    <rect x="137" y="60" width="626" height="1000" rx="74" fill="#07100e"/>
    <rect x="158" y="92" width="584" height="936" rx="56" fill="url(#screenBg)"/>
    <path d="M363 92h174c-7 34-28 51-64 51h-46c-36 0-57-17-64-51Z" fill="#07100e"/>

    <g filter="url(#softShadow)">
      <rect x="190" y="178" width="520" height="222" rx="34" fill="url(#cover)"/>
      <circle cx="606" cy="246" r="70" fill="#d8ebdf" opacity=".72"/>
      <path d="M265 348c64-70 131-104 200-104 75 0 133 43 174 129H267c-14 0-20-10-2-25Z" fill="#38635d" opacity=".9"/>
      <path d="M345 343c43-49 88-73 134-73 50 0 89 30 117 90H347c-10 0-14-7-2-17Z" fill="#35d45b"/>
      <path d="M450 204c32 0 58 26 58 58s-26 58-58 58-58-26-58-58 26-58 58-58Z" fill="#fffaf0" opacity=".96"/>
      <path d="M421 286c11 13 20 32 22 58h14c2-26 11-45 22-58-9 5-18 7-29 7s-20-2-29-7Z" fill="#17211f"/>
    </g>

    <text x="202" y="466" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="900">Today in Dallas</text>
    <text x="202" y="506" fill="#5d6b66" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Stay close to the next right step.</text>

    <rect x="202" y="548" width="496" height="114" rx="24" fill="#ffffff" stroke="#dfe7e2"/>
    <rect x="226" y="573" width="64" height="64" rx="18" fill="#e7f3ed"/>
    <text x="244" y="613" fill="#38635d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">01</text>
    <text x="316" y="598" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Recovery plan</text>
    <text x="316" y="631" fill="#66736e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Goals, triggers, coping actions.</text>

    <rect x="202" y="688" width="496" height="114" rx="24" fill="#ffffff" stroke="#dfe7e2"/>
    <rect x="226" y="713" width="64" height="64" rx="18" fill="#e7f3ed"/>
    <text x="244" y="753" fill="#38635d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">02</text>
    <text x="316" y="738" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Accountability</text>
    <text x="316" y="771" fill="#66736e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Check-ins, partners, buddies.</text>

    <rect x="202" y="828" width="238" height="132" rx="28" fill="#38635d"/>
    <text x="226" y="878" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Next anchor</text>
    <text x="226" y="912" fill="#dcebe4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Breathe, text Jan,</text>
    <text x="226" y="940" fill="#dcebe4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">walk for 10 min.</text>

    <rect x="460" y="828" width="238" height="132" rx="28" fill="#ffffff" stroke="#dfe7e2"/>
    <text x="484" y="878" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Reminder</text>
    <text x="484" y="912" fill="#66736e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Tonight at 18:00</text>
    <rect x="484" y="928" width="138" height="12" rx="6" fill="url(#accent)"/>
  </g>
</svg>
